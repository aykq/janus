name: Android build
run-name: "Android • ${{ inputs.ref || github.ref_name }}"

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:
    inputs:
      ref:
        description: "Git ref (branch/tag/sha)"
        required: false
        default: "master"

permissions:
  contents: read

env:
  # Must equal BUILD_OFFSET in publish-candidate.yml; devices compare versionCodes across both.
  BUILD_OFFSET: 100

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || format('build-{0}', inputs.ref || github.ref_name) }}
  cancel-in-progress: false

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Checkout
      uses: actions/checkout@v7
      with:
        ref: ${{ inputs.ref }}
        submodules: recursive
        fetch-depth: 0

    - name: Set up JDK
      uses: actions/setup-java@v6
      with:
        distribution: temurin
        java-version: "17"

    - name: Set up Gradle
      uses: gradle/actions/setup-gradle@v6

    - name: Set up Android SDK
      uses: android-actions/setup-android@v4
      with:
        # The legacy "tools" package (part of the action's default) was removed
        # from Google's SDK repository; AGP downloads whatever else it needs.
        packages: "platform-tools build-tools;36.0.0"

    - name: Build
      shell: bash
      run: |
        set -euo pipefail
        chmod +x ./gradlew
        ./gradlew --no-daemon --stacktrace -PjanusBuildNumber=$(( ${{ github.run_number }} + BUILD_OFFSET )) :ui:testReleaseUnitTest :ui:assembleRelease

    - name: Upload unsigned APK
      uses: actions/upload-artifact@v7
      with:
        name: release-apk-unsigned
        path: ./ui/build/outputs/apk/release/ui-release-unsigned.apk
        if-no-files-found: error

    - name: Sign and publish stable release
      if: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.ref == 'master') }}
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        KEYSTORE_B64: ${{ secrets.JANUS_RELEASE_KEYSTORE_B64 }}
        KEYSTORE_PASSWORD: ${{ secrets.JANUS_RELEASE_KEYSTORE_PASSWORD }}
      run: |
        set -euo pipefail
        if [[ -z "${KEYSTORE_B64}" || -z "${KEYSTORE_PASSWORD}" ]]; then
          echo "Missing secret JANUS_RELEASE_KEYSTORE_B64 / JANUS_RELEASE_KEYSTORE_PASSWORD" >&2
          exit 1
        fi
        echo "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/janus-release.p12"
        CODE="$(( ${{ github.run_number }} + BUILD_OFFSET ))"
        SHA="$(git rev-parse HEAD)"
        APK="janus-${CODE}-stable.apk"
        "$ANDROID_HOME/build-tools/36.0.0/apksigner" sign --ks "$RUNNER_TEMP/janus-release.p12" --ks-pass env:KEYSTORE_PASSWORD --ks-key-alias janus --out "$APK" ./ui/build/outputs/apk/release/ui-release-unsigned.apk
        "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify "$APK"
        SUM="$(sha256sum "$APK" | cut -d' ' -f1)"
        {
          echo "Janus build ${CODE} from master (${SHA})."
          echo
          echo "<!-- janus-update"
          echo "versionCode: ${CODE}"
          echo "sha256: ${SUM}"
          echo "channel: stable"
          echo "-->"
        } > notes.md
        gh release delete stable --cleanup-tag --yes || true
        gh release create stable "$APK" --target "$SHA" --title "Janus (build ${CODE})" --notes-file notes.md --latest
